header:
  version: 14
distro: kronus
machine: qemuriscv64
target: kronus-image
repos:
  kronus:
    layers:
      meta-kronus:
  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: cff3be6f664f8f07a40727ff63eeeb24d6f5e00b # yocto-5.0.20
    layers:
      .: disabled
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: 70dc15941dd33270a92d1001174efb3093e79bdf # yocto-5.0.20
    layers:
      meta:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: b5874ea07d69919d9b40d59f2c2f0bbd24bc3259 # scarthgap
    layers:
      meta-oe:

local_conf_header:
  kronus-common: |
    USER_CLASSES:append = " buildhistory buildstats buildstats-summary"
    INHERIT:append = " rm_work"
    RM_OLD_IMAGE = "1"
    ERROR_QA:remove = "version-going-backwards"
    HOSTTOOLS += "truncate"
    GLIBC_GENERATE_LOCALES = "en_US.UTF-8"
    hostname:pn-base-files ?= "kronus"
