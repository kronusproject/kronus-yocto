header:
  version: 14
distro: kronus
machine: qemuriscv64
target: kronus-image
repos:
  kronus:
    layers:
      meta-kronus:
  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514 # yocto-6.0.3
    layers:
      .: disabled
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: ef022bf82d79015802309d14c28b13373ebe53f5 # yocto-6.0.3
    layers:
      meta:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: 47d7dbdd10890bbd429bc0cccbe14435c37e5af1 # wrynose
    layers:
      meta-oe:

local_conf_header:
  kronus-common: |
    USER_CLASSES:append = " buildhistory buildstats buildstats-summary"
    INHERIT:append = " rm_work"
    RM_OLD_IMAGE = "1"
    ERROR_QA:remove = "version-going-backwards"
    HOSTTOOLS += "truncate"
    GLIBC_GENERATE_LOCALES = "en_US.UTF-8"
    hostname:pn-base-files ?= "kronus"
