header:
  version: 14
distro: kronus
machine: qemuriscv64
target: kronus-image
repos:
  kronus:
    layers:
      meta-kronus:
  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: 982645110a19ebb94d519926a4e14c8a2a205cfd # 2.8.12,yocto-5.0.12,2024-04.12-scarthgap
    layers:
      .: disabled
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: 93c7489d843a0e46fe4fc685b356d0ae885300d7  # 2024-04.12,yocto-5.0.12,2024-04.12-scarthgap
    layers:
      meta:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: e621da947048842109db1b4fd3917a02e0501aa2 # scarthgap
    layers:
      meta-oe:

local_conf_header:
  kronus-common: |
    USER_CLASSES:append = " buildhistory buildstats buildstats-summary"
    INHERIT:append = " rm_work"
    RM_OLD_IMAGE = "1"
    ERROR_QA:remove = "version-going-backwards"
    HOSTTOOLS += "truncate"
    GLIBC_GENERATE_LOCALES = "en_US.UTF-8"
    hostname:pn-base-files ?= "kronus"
